<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <!-- Content Security Policy: dice al browser da dove può caricare script, stili e dati.
         Solo dal sito stesso ('self'): se mai qualcuno riuscisse a infilare del codice nella pagina
         (es. con un file importato fatto apposta), il browser si rifiuterebbe di eseguirlo
         e di mandare i dati altrove. 'wasm-unsafe-eval' serve a sql.js (SQLite è in WebAssembly);
         'unsafe-inline' negli stili serve per i colori delle icone (style="..."). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Finanza">
    <meta name="theme-color" content="#5b9a78">
    <title>Finanza</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icona-180.png">
    <link rel="icon" href="icona-192.png">
    <link rel="stylesheet" href="stile.css">
</head>
<body>
    <header>
        <button id="indietro" class="indietro" aria-label="Indietro" hidden>‹</button>
        <h1 id="titolo">Finanza</h1>
        <!-- Modalità privacy: nasconde saldi e importi (vedi app.js) -->
        <button id="occhio" class="occhio"></button>
    </header>

    <p id="avviso" hidden></p>

    <!-- Qui dentro app.js disegna la pagina scelta -->
    <main></main>

    <nav>
        <a href="#/" data-sezione="home"><span>🏠</span>Home</a>
        <a href="#/conti" data-sezione="conti"><span>💳</span>Conti</a>
        <a href="#/categorie" data-sezione="categorie"><span>🏷️</span>Categorie</a>
        <a href="#/impostazioni" data-sezione="impostazioni"><span>⚙️</span>Impostazioni</a>
    </nav>

    <!-- Librerie esterne, salvate nel progetto così l'app funziona anche offline -->
    <script src="lib/sql-wasm.js"></script>
    <script src="lib/jszip.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
